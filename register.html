<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="css/register.css">
</head>
<body>


    <form action="">

        <legend>Join Us and start your journey today!</legend>
        <br>

        <label for="fname"> FirstName :</label>
        <input type="text"  id="fname" placeholder="e.g John "  required>
        <br><br>

        <label for="sname"> SurName :</label>
        <input type="text"  id="sname" placeholder="e.g  Doe"  required>
        <br><br>

          <label for="email"> Email Address:</label>
        <input type="email"  id="email" placeholder="e.g abc@gmail.com"  required>
        <br><br>

          <label for="pwd"> Password :</label>
        <input type="password"  id="pwd" placeholder="Type password"  required>
        <br><br>


          <label for="height"> Enter height :</label>
        <input type="number"  id="height" placeholder="e.g 3(in cm)"  required>
        <br><br>


        <label for="yob"> Year Of Birth :</label>
        <input type="date" id="yob" required>
        <br><br>

        <label for="dt"> Date and Time :</label>
        <input type="datetime-local" id="dt" required>
        <br><br>

        <label for="upload"> Upload image :</label>
        <input type="file" id="upload" required>
        <br><br>

        <label for="yos"> Select year of study :</label>
        <!---Dropdown-->
        <select name="" id="yos">
            <option value="" disabled>--Select One---</option>
            <option value="">Year 1</option>
            <option value="">Year 2</option>
            <option value="" disabled>Year 3</option>
            <option value="">Year 4</option>
        </select>
        <!--End-->

        <br><br>


        <label>Choose favourite football team:</label><br>

        <input type="radio" id="arsenal" name="team">
        <label for="arsenal">Arsenal</label> <br>

        <input type="radio" id="chelsea" name="team">
        <label for="chelsea">chelsea</label> <br>

        <input type="radio" id="liverpool" name="team">
        <label for="liverpool">Liverpool</label> <br>
        <br><br>


        <label for="">Select Language :</label><br>

        <input type="checkbox" id="kiswahili" name="kiswahili">
        <label for="kiswahili">Kiswahili</label><br>

        <input type="checkbox" id="english" name="english">
        <label for="english">English</label><br>

        <input type="checkbox" id="german" name="german">
        <label for="german">German</label><br>
        <br>

        <label for="message">Message</label><br>
        <textarea name="" id=""  cols="40"  rows="10"></textarea>
        <br><br>

        <button type="submit">Register</button>
















    </form>

    <br><br><br><br><br><br><br><br><br><br>




    
</body>
</html>
